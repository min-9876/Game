<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; }
        canvas { background: #1e293b; display: block; margin: 15px auto; border: 2px solid #334155; border-radius: 8px; }
        .container { padding: 10px; }
        button { padding: 10px 20px; background: #0ea5e9; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0284c7; }
        #leaderboard { max-width: 320px; margin: 15px auto; background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
        ol { text-align: left; padding-left: 20px; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🐍 Snake Arena</h2>
        <p id="player-greeting">Loading player...</p>
        <div>Score: <span id="score" style="font-weight: bold; color: #38bdf8;">0</span></div>
        <canvas id="gameCanvas" width="320" height="320"></canvas>
        <button onclick="startGame()">Start / Restart Game</button>
        
        <div id="leaderboard">
            <h3 style="margin: 5px 0;">🏆 Top Players</h3>
            <div id="leaderboard-list">Loading...</div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
